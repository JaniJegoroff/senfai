<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" fill="none">
  <defs>
    <radialGradient id="atmosphere">
      <stop stop-color="#315c62" stop-opacity=".38"/>
      <stop offset="1" stop-color="#14232f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool">
      <stop stop-color="#55e9ab" stop-opacity=".16"/>
      <stop offset="1" stop-color="#55e9ab" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="270" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c303e"/>
      <stop offset=".55" stop-color="#12252d"/>
      <stop offset="1" stop-color="#102021"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="270" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6c9eff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#a0dbc9" stop-opacity=".1"/>
      <stop offset="1" stop-color="#55e9ab" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="mint" x1="27" y1="81" x2="243" y2="243" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a4ffcf"/><stop offset=".5" stop-color="#55e9ab"/><stop offset="1" stop-color="#41bca1"/>
    </linearGradient>
    <linearGradient id="blue" x1="27" y1="27" x2="243" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ccbff"/><stop offset="1" stop-color="#638deb"/>
    </linearGradient>
    <linearGradient id="coral" x1="27" y1="135" x2="81" y2="243" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffbaa3"/><stop offset="1" stop-color="#df748b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" stroke="#92b8c3" stroke-opacity=".1"/>
      <circle cx="27" cy="27" r="2" fill="#729b9e" fill-opacity=".35"/>
    </pattern>
    <path id="mint-path" d="M27 81H123Q135 81 135 93V177Q135 189 147 189H231Q243 189 243 201V231Q243 243 231 243H135"/>
    <path id="blue-path" d="M27 27H231Q243 27 243 39V123Q243 135 231 135H189"/>
    <path id="coral-path" d="M81 243H39Q27 243 27 231V147Q27 135 39 135H69Q81 135 81 147V189"/>
  </defs>

  <!-- A still composition: all light is painted into the locally bundled SVG. -->
  <ellipse cx="300" cy="172" rx="288" ry="165" fill="url(#atmosphere)"/>
  <ellipse cx="300" cy="299" rx="215" ry="49" fill="url(#pool)"/>
  <ellipse cx="300" cy="304" rx="170" ry="20" fill="#040a11" opacity=".45"/>

  <!-- The lower edge gives the puzzle a little depth without an animation layer. -->
  <g transform="matrix(.9 .48 -.9 .48 300 48)">
    <rect width="270" height="270" rx="24" fill="#0a1720" stroke="#294043" stroke-width="1.5"/>
  </g>
  <g transform="matrix(.9 .48 -.9 .48 300 38)">
    <rect width="270" height="270" rx="24" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="10" y="10" width="250" height="250" rx="17" stroke="#94b8b7" stroke-opacity=".06"/>
    <rect x="13" y="13" width="244" height="244" rx="14" fill="url(#grid)"/>

    <g stroke-width="21" stroke-linecap="round" filter="url(#glow)" opacity=".65">
      <use href="#blue-path" stroke="#6c9eff"/>
      <use href="#coral-path" stroke="#ff869c"/>
      <use href="#mint-path" stroke="#55e9ab"/>
    </g>
    <g transform="translate(2 2)" stroke="#060f17" stroke-width="11" stroke-linecap="round" opacity=".55">
      <use href="#blue-path"/><use href="#coral-path"/><use href="#mint-path"/>
    </g>
    <g stroke-width="8" stroke-linecap="round">
      <use href="#blue-path" stroke="url(#blue)"/>
      <use href="#coral-path" stroke="url(#coral)"/>
      <use href="#mint-path" stroke="url(#mint)"/>
    </g>
    <g stroke-width="1.5" stroke-linecap="round" opacity=".55">
      <use href="#blue-path" stroke="#d3eaff"/>
      <use href="#coral-path" stroke="#ffded1"/>
      <use href="#mint-path" stroke="#d7ffec"/>
    </g>

    <g fill="#122832" stroke-width="6">
      <g stroke="#8dbaff"><circle cx="27" cy="27" r="12"/><circle cx="189" cy="135" r="12"/></g>
      <g stroke="#f5a3aa"><circle cx="81" cy="243" r="12"/><circle cx="81" cy="189" r="12"/></g>
      <g stroke="#8ff9c4"><circle cx="27" cy="81" r="13"/><circle cx="135" cy="243" r="13"/></g>
    </g>
    <g fill="#d4fbe9">
      <circle cx="27" cy="81" r="4"/><circle cx="135" cy="243" r="4"/>
    </g>
    <g fill="#d1e4ff"><circle cx="27" cy="27" r="3"/><circle cx="189" cy="135" r="3"/></g>
    <g fill="#ffdbd1"><circle cx="81" cy="243" r="3"/><circle cx="81" cy="189" r="3"/></g>
  </g>

  <g fill="#8baebd">
    <circle cx="111" cy="83" r="1.5" opacity=".4"/>
    <circle cx="488" cy="113" r="2" opacity=".35"/>
    <circle cx="432" cy="294" r="1.5" opacity=".3"/>
    <circle cx="139" cy="273" r="1" opacity=".5"/>
  </g>
</svg>
